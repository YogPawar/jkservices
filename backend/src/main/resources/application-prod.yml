server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.jkservice: INFO
  file:
    name: ${JK_SERVICE_LOG_DIR:./logs}/jkservice.log

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false