server:
  port: 8080
spring:
  application:
    name: jkservice-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/jkservicedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:jk}
    password: ${DB_PASSWORD:jkbro}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    com.shetiledger: DEBUG
  file:
    name: logs/jkservice.log
