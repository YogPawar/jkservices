services:
  mysql:
    image: mysql:8.4
    container_name: jk-service-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jkservicedb
      MYSQL_USER: jk
      MYSQL_PASSWORD: jkbro
    ports: ["3307:3306"]
    volumes: ["jkservice_mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  jkservice_mysql_data:
